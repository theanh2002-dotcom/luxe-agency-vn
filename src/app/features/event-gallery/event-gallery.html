<!-- Gallery Page - Mobile First Design -->
<div class="gallery-page" *ngIf="!isLoading()">

  <!-- ===== HEADER SECTION ===== -->
  <div class="gallery-header">
    <div class="header-ornament">
      <div class="ornament-line"></div>
      <svg class="ornament-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path
          d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
      </svg>
      <div class="ornament-line"></div>
    </div>

   
    <div class="header-meta">
      <span class="meta-badge">
        <svg viewBox="0 0 20 20" fill="currentColor" class="meta-icon">
          <path fill-rule="evenodd"
            d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z"
            clip-rule="evenodd" />
        </svg>
        {{ photoCount() }} ảnh
      </span>
      <span class="meta-badge meta-badge--live" *ngIf="isPolling()">
        <span class="pulse-dot"></span>
        Đang cập nhật
      </span>
    </div>
  </div>

  <!-- ===== MAIN PHOTO VIEWER ===== -->
  <div class="gallery-main-photo" *ngIf="photoCount() > 0">
    <div class="main-photo-container">
      <!-- Counter badge -->
      <div class="photo-counter">
        {{ selectedIndex() + 1 }}/{{ photoCount() }}
      </div>

      <!-- Nav arrows -->
      <button class="nav-arrow nav-arrow--left" (click)="navigatePrev()" *ngIf="photoCount() > 1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <button class="nav-arrow nav-arrow--right" (click)="navigateNext()" *ngIf="photoCount() > 1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>

      <!-- Main Image -->
      <!-- Image Cache DOM Layer (Tối ưu giữ nguyên DOM, chỉ đổi Opacity) -->
      <div class="main-photo-layer">
        <img *ngFor="let photo of photos(); let i = index" 
          [src]="getPhotoSrc(photo)" 
          [alt]="photo.name || 'Ảnh sự kiện'" 
          class="main-photo-img"
          [style.opacity]="i === selectedIndex() ? '1' : '0'"
          [style.visibility]="i === selectedIndex() ? 'visible' : 'hidden'"
          [style.pointer-events]="i === selectedIndex() ? 'auto' : 'none'"
          (click)="openLightbox(i)" />
      </div>

      <!-- Action Buttons -->
      <div class="main-photo-actions">
        <button class="action-btn" (click)="downloadPhoto(selectedPhoto())">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
        </button>
        <button class="action-btn" (click)="openLightbox(selectedIndex())">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== STICKY BOTTOM BAR ===== -->
  <div class="gallery-bottom-bar">
    <!-- ===== THUMBNAIL STRIP ===== -->
    <div class="thumbnail-section" *ngIf="photoCount() > 1">
      <div class="thumbnail-strip">
        <div *ngFor="let photo of photos(); let i = index" class="thumbnail-item"
          [class.thumbnail-item--active]="i === selectedIndex()" [class.thumbnail-item--new]="photo.isNew"
          (click)="selectPhoto(i)">
          <img [src]="getThumbSrc(photo)" [alt]="photo.name" loading="lazy" />
          <span class="new-badge" *ngIf="photo.isNew">Mới</span>
        </div>
      </div>
    </div>

    <!-- ===== DOWNLOAD ALL BUTTON ===== -->
    <div class="download-all-section" *ngIf="photoCount() > 0">
      <button class="download-all-btn" (click)="downloadAllPhotos()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Tải tất cả ảnh
      </button>
    </div>
  </div>



</div>

<!-- ===== LOADING STATE ===== -->
<div class="loading-state" *ngIf="isLoading()">
  <div class="loading-spinner">
    <div class="spinner-ring"></div>
    <div class="spinner-ring spinner-ring--delay"></div>
  </div>
  <p class="loading-text">Đang tải ảnh sự kiện...</p>
</div>

<!-- ===== EMPTY STATE ===== -->
<div class="empty-state" *ngIf="!isLoading() && photoCount() === 0 && !errorMessage()">
  <div class="empty-icon-wrapper">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-icon">
      <rect x="8" y="12" width="48" height="40" rx="4" />
      <circle cx="22" cy="28" r="5" />
      <path d="M8 44l14-14 10 10 8-8 16 16" />
    </svg>
  </div>
  <h3 class="empty-title">Ảnh đang được chuẩn bị</h3>
  <p class="empty-desc">Hệ thống đang xử lý và tải ảnh lên.<br />Ảnh sẽ tự động hiện ra khi sẵn sàng.</p>
  <div class="empty-pulse">
    <span class="pulse-dot pulse-dot--lg"></span>
    <span>Đang chờ...</span>
  </div>
</div>

<!-- ===== ERROR STATE ===== -->
<div class="empty-state" *ngIf="errorMessage()">
  <p class="error-text">{{ errorMessage() }}</p>
</div>

<!-- ===== FULLSCREEN LIGHTBOX ===== -->
<div class="lightbox" *ngIf="showLightbox()" (click)="closeLightbox()" (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)">
  <div class="lightbox-backdrop"></div>

  <!-- Close Button -->
  <button class="lightbox-close" (click)="closeLightbox()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  </button>

  <!-- Lightbox Counter -->
  <div class="lightbox-counter">
    {{ lightboxIndex() + 1 }} / {{ photoCount() }}
  </div>

  <!-- Lightbox Image -->
  <div class="lightbox-content" (click)="$event.stopPropagation()">
    <img [src]="getPhotoSrc(photos()[lightboxIndex()])" [alt]="photos()[lightboxIndex()]?.name" class="lightbox-img" />
  </div>

  <!-- Lightbox Nav -->
  <button class="lightbox-nav lightbox-nav--left" (click)="$event.stopPropagation(); lightboxPrev()"
    *ngIf="photoCount() > 1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6" />
    </svg>
  </button>
  <button class="lightbox-nav lightbox-nav--right" (click)="$event.stopPropagation(); lightboxNext()"
    *ngIf="photoCount() > 1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6" />
    </svg>
  </button>

  <!-- Lightbox Download -->
  <button class="lightbox-download" (click)="$event.stopPropagation(); downloadPhoto(photos()[lightboxIndex()])">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
      <polyline points="7 10 12 15 17 10" />
      <line x1="12" y1="15" x2="12" y2="3" />
    </svg>
    Tải ảnh này
  </button>
</div>
