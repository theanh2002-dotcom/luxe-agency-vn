<header class="fixed w-full top-0 z-[200] glass-pearl transition-all duration-300 px-6 py-4 soft-shadow">
  <div class="max-w-7xl mx-auto flex items-center justify-between md:justify-start">
    <!-- Logo bên trái -->
    <div class="flex items-center gap-3 cursor-pointer shrink-0" routerLink="/">
      <img src="/logo.png" alt="Pica&Event Logo" class="h-9 w-9 object-contain rounded-full border border-[#B76E79]/20 soft-shadow bg-white/90 p-0.5" />
      <span class="text-2xl font-serif text-rose-gradient font-semibold tracking-wide">
        Pica&amp;Event
      </span>
    </div>

    <!-- Nav căn giữa tuyệt đối (Desktop) -->
    <div class="hidden md:flex flex-1 justify-center">
      <nav class="flex gap-8 items-center bg-white/70 px-8 py-2 rounded-[12px] border border-[#B76E79]/20 soft-shadow">
        <a routerLink="/" routerLinkActive="text-[#B76E79]" [routerLinkActiveOptions]="{exact: true}" class="text-sm font-sans font-medium text-[#2D2D2D] hover:text-[#B76E79] transition-colors">Trang Chủ</a>
        <a routerLink="/portfolio" routerLinkActive="text-[#B76E79]" class="text-sm font-sans font-medium text-[#2D2D2D]/70 hover:text-[#B76E79] transition-colors">Bộ Sưu Tập</a>
        <a routerLink="/services" routerLinkActive="text-[#B76E79]" class="text-sm font-sans font-medium text-[#2D2D2D]/70 hover:text-[#B76E79] transition-colors">Dịch Vụ</a>
        <a routerLink="/software" routerLinkActive="text-[#B76E79]" class="text-sm font-sans font-medium text-[#2D2D2D]/70 hover:text-[#B76E79] transition-colors">Phần Mềm</a>
        <a routerLink="/contact" routerLinkActive="text-[#B76E79]" class="text-sm font-sans font-medium text-[#2D2D2D]/70 hover:text-[#B76E79] transition-colors">Liên Hệ</a>
      </nav>
    </div>

    <!-- Nút Menu Hamburger (Mobile) -->
    <button class="md:hidden flex items-center justify-center p-2 text-[#2D2D2D]" (click)="toggleMobileMenu()">
      <svg *ngIf="!isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <svg *ngIf="isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- Placeholder cùng chiều rộng với logo để giữ nav đúng giữa (Desktop) -->
    <div class="hidden md:block shrink-0 w-[120px]"></div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div *ngIf="isMobileMenuOpen()" class="md:hidden absolute top-full left-0 w-full bg-white/95 backdrop-blur-md border-b border-[#B76E79]/20 soft-shadow flex flex-col py-4 px-6 gap-4">
    <a routerLink="/" routerLinkActive="text-[#B76E79]" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()" class="text-base font-sans font-medium text-[#2D2D2D] hover:text-[#B76E79] transition-colors py-2 border-b border-gray-100">Trang Chủ</a>
    <a routerLink="/portfolio" routerLinkActive="text-[#B76E79]" (click)="closeMobileMenu()" class="text-base font-sans font-medium text-[#2D2D2D]/70 hover:text-[#B76E79] transition-colors py-2 border-b border-gray-100">Bộ Sưu Tập</a>
    <a routerLink="/services" routerLinkActive="text-[#B76E79]" (click)="closeMobileMenu()" class="text-base font-sans font-medium text-[#2D2D2D]/70 hover:text-[#B76E79] transition-colors py-2 border-b border-gray-100">Dịch Vụ</a>
    <a routerLink="/software" routerLinkActive="text-[#B76E79]" (click)="closeMobileMenu()" class="text-base font-sans font-medium text-[#2D2D2D]/70 hover:text-[#B76E79] transition-colors py-2 border-b border-gray-100">Phần Mềm</a>
    <a routerLink="/contact" routerLinkActive="text-[#B76E79]" (click)="closeMobileMenu()" class="text-base font-sans font-medium text-[#2D2D2D]/70 hover:text-[#B76E79] transition-colors py-2">Liên Hệ</a>
  </div>
</header>
